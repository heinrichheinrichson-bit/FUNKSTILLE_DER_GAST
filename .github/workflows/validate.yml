name: Validate story

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate story data
        shell: pwsh
        run: .\tools\validate-story.ps1

      - name: Audit story paths
        shell: pwsh
        run: .\tools\audit-paths.ps1

      - name: Test story engine
        run: npm test

      - name: Install game dependencies
        working-directory: game
        run: npm ci

      - name: Build game prototype
        id: game-build
        continue-on-error: true
        working-directory: game
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Report game build failure
        if: steps.game-build.outcome == 'failure'
        working-directory: game
        shell: bash
        run: |
          message="$(tail -n 24 build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
          echo "::error title=Game build failed::$message"
          exit 1
